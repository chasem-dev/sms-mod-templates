# A server mod: it runs on the host of a multiplayer game (a dedicated server
# as a rule), and the players join with the plain game, nothing installed.
# (../README.md says what it does.)
id = splash-battle
name = Splash Battle
version = 1.0.0
author = chasem-dev
description = A water fight for everyone who joins: spray the others with FLUDD, each hit splashing them as Shadow Mario is splashed, last one standing wins
library = splash_battle
side = server
# the players' games need the water fights' and arenas' commands (mod API 1.5)
client_api = 1.5
gameplay = 1
