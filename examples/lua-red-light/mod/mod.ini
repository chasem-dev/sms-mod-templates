# A Lua server mod: it runs on the host of a multiplayer game (with the lua
# mod installed there), and players join with the plain game.
# (../README.md says what it does.)
id = lua-red-light
name = Red Light, Green Light (Lua)
version = 1.0.0
author = sms-mod-templates
description = Run for the goal up Bianco Hills' path on green; anyone moving on red goes back to the start
runtime = lua
script = main.lua
side = server
# the players' games need the 1.2 commands it sends (the host refuses older ones)
client_api = 1.2
gameplay = 1
